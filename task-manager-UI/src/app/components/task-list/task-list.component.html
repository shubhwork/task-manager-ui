<app-header (openAddTaskClicked)="showAddTask = true"></app-header>

<app-add-task
  *ngIf="showAddTask"
  (taskAdded)="onTaskAdded($event); showAddTask = false"
  (closeEvent)="showAddTask = false">
</app-add-task>

<div class="dashboard">
  <h1>Welcome to Task Manager!</h1>
  <div class="stats">
    <div class="stat">
      <span class="stat-number">{{ completedCount }}</span>
      <span class="stat-label">Completed</span>
    </div>
    <div class="stat">
      <span class="stat-number">{{ incompleteCount }}</span>
      <span class="stat-label">Incomplete</span>
    </div>
    <div class="stat" *ngIf="dueTodayCount !== undefined">
      <span class="stat-number">{{ dueTodayCount }}</span>
      <span class="stat-label">Due Today</span>
    </div>
  </div>
</div>

<div class="task-list-toolbar">
  <h2>Task List</h2>
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Search tasks..."
    class="search-bar"
  />
  <div class="filter-group">
    <select [(ngModel)]="selectedPriority" class="filter-dropdown">
      <option value="">All Priorities</option>
      <option value="HIGH">High</option>
      <option value="MEDIUM">Medium</option>
      <option value="LOW">Low</option>
    </select>
    <input
      type="date"
      [(ngModel)]="selectedDueDate"
      class="filter-dropdown"
      placeholder="Filter by Due Date"
    />
  </div>
</div>

<!-- Task items will be displayed here -->
<app-task-item
  *ngFor="let task of paginatedTasks"
  [task]="task"
  (editTask)="openEditTask($event)"
  (deleteTask)="onDeleteTask($event)"
  (toggleComplete)="onToggleComplete($event)">
</app-task-item>

<!-- Pagination Controls -->
<div class="pagination" *ngIf="totalPages > 1">
  <button (click)="goToPage(page - 1)" [disabled]="page === 1">&laquo; Prev</button>
  <span>Page {{ page }} of {{ totalPages }}</span>
  <button (click)="goToPage(page + 1)" [disabled]="page === totalPages">Next &raquo;</button>
</div>

<!-- Edit Task Component -->
<app-edit-task
  *ngIf="editingTask"
  [task]="editingTask"
  (close)="editingTask = null"
  (save)="onSaveEdit($event)">
</app-edit-task>

<!-- Add Task Component -->


<app-edit-task
  *ngIf="editingTask"
  [task]="editingTask"
  (close)="editingTask = null"
  (save)="onSaveEdit($event)">
</app-edit-task>

<app-add-task
  *ngIf="showAddTask"
  (taskAdded)="onTaskAdded($event); showAddTask = false"
  (closeEvent)="showAddTask = false">
</app-add-task>

<!-- Confirmation Dialog -->
<div class="confirm-backdrop" *ngIf="showConfirmDialog"></div>
<div class="confirm-modal" *ngIf="showConfirmDialog">
  <div class="confirm-content">
    <h3>Delete Task</h3>
    <p>Are you sure you want to delete this task?</p>
    <div class="confirm-actions">
      <button class="confirm-btn" (click)="confirmDelete()">Yes, Delete</button>
      <button class="cancel-btn" (click)="cancelDelete()">Cancel</button>
    </div>
  </div>
</div>
